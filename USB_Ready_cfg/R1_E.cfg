hostname R1E
!
! ================================================================
! Global SR-MPLS
! ================================================================
segment-routing mpls
 !
 set-attributes
  address-family ipv4
   sr-label-preferred
  exit-address-family
!
! ================================================================
! VRF Definitions — MUST appear before interfaces that reference them
! On IOS-XE, route-target MUST be inside address-family ipv4
!
! Naming: CLIENT_N maps strictly to RD 65000:N.
! Every R1E tenant exports its own RT plus 65000:1000 (TO_DC_PUB).
! Slican access (65000:100) is intentionally NOT imported here —
! SW_AGR1 tenants reach Supermicro only, not the PBX.
! ================================================================
!
vrf definition CLIENT1
 rd 65000:1
 !
 address-family ipv4
  route-target export 65000:1
  route-target export 65000:1000
  route-target import 65000:1
  route-target import 65000:99
 exit-address-family
!
