hostname R1E
!
! ================================================================
! Global SR-MPLS
! ================================================================
segment-routing mpls
 !
 set-attributes
  address-family ipv4
   sr-label-preferred
  exit-address-family
!
! ================================================================
! VRF Definitions — MUST appear before interfaces that reference them
! On IOS-XE, route-target MUST be inside address-family ipv4
! ================================================================
!
vrf definition CLIENT1
 rd 65000:1
 !
 address-family ipv4
  route-target export 65000:1
  route-target import 65000:1
  route-target import 65000:100
  route-target import 65000:99
 exit-address-family
!
vrf definition CLIENT2
 rd 65000:2
 !
 address-family ipv4
  route-target export 65000:2
  route-target import 65000:2
  route-target import 65000:100
  route-target import 65000:99
 exit-address-family
!
! ================================================================
! Loopback — Router-ID, SR-ID, BGP update-source
! ================================================================
interface Loopback0
 ip address 10.255.11.11 255.255.255.255
 ip router isis CORE
 isis prefix-sid index 110
!
! ================================================================
! WAN Uplink to Core P Router R1C
! ================================================================
interface GigabitEthernet0/0/2
 description TO-R1C
 ip address 10.0.101.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 no shutdown
!
! ================================================================
! Trunk to Aggregation Switch SW_AGR1
! Carries VLAN 101 (CLIENT1) and VLAN 102 (CLIENT2)
! ================================================================
interface GigabitEthernet0/0/0
 description TRUNK-TO-SW_AGR1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0/0.101
 description CLIENT1
 encapsulation dot1Q 101
 vrf forwarding CLIENT1
 ip address 172.16.1.1 255.255.255.252
!
interface GigabitEthernet0/0/0.102
 description CLIENT2
 encapsulation dot1Q 102
 vrf forwarding CLIENT2
 ip address 172.16.2.1 255.255.255.252
!
! ================================================================
! IS-IS — Backbone IGP (transport + segment routing)
! ================================================================
router isis CORE
 net 49.0001.0102.5501.1011.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 fast-reroute per-prefix level-2 all
 segment-routing mpls
!
! ================================================================
! MP-BGP — iBGP VPNv4 to Route Reflector + per-VRF eBGP to CE
! ================================================================
router bgp 65000
 bgp log-neighbor-changes
 !
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Loopback0
 !
 neighbor 10.255.2.2 remote-as 65000
 neighbor 10.255.2.2 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community extended
  neighbor 10.255.2.2 activate
  neighbor 10.255.2.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CLIENT1
  neighbor 172.16.1.2 remote-as 65021
  neighbor 172.16.1.2 activate
 exit-address-family
 !
 address-family ipv4 vrf CLIENT2
  neighbor 172.16.2.2 remote-as 65021
  neighbor 172.16.2.2 activate
 exit-address-family
!
end