hostname R3E
!
! ================================================================
! Global SR-MPLS
! ================================================================
segment-routing mpls
 !
 set-attributes
  address-family ipv4
   sr-label-preferred
  exit-address-family
!
! ================================================================
! VRF Definitions — MUST appear before interfaces that reference them
! On IOS-XE, route-target MUST be inside address-family ipv4
! ================================================================
!
vrf definition CLIENT5
 rd 65000:5
 !
 address-family ipv4
  route-target export 65000:5
  route-target import 65000:5
  route-target import 65000:100
  route-target import 65000:99
 exit-address-family
!
vrf definition DC_CENTRAL
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
  route-target import 65000:1
  route-target import 65000:2
  route-target import 65000:3
  route-target import 65000:4
  route-target import 65000:5
 exit-address-family
!
vrf definition DC_PUB
 rd 65000:99
 !
 address-family ipv4
  route-target export 65000:99
  route-target import 65000:99
  route-target import 65000:1
  route-target import 65000:2
  route-target import 65000:3
  route-target import 65000:4
  route-target import 65000:5
 exit-address-family
!
! ================================================================
! Loopback — Router-ID, SR-ID, BGP update-source
! ================================================================
interface Loopback0
 ip address 10.255.13.13 255.255.255.255
 ip router isis CORE
 isis prefix-sid index 130
!
! ================================================================
! WAN Uplink to Core P Router R3C
! ================================================================
interface GigabitEthernet0/0/2
 description TO-R3C
 ip address 10.0.103.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 no shutdown
!
! ================================================================
! Trunk to Aggregation Switch SW_AGR3
! Carries VLAN 105 (CLIENT5) and VLAN 200 (DC_CENTRAL)
! ================================================================
interface GigabitEthernet0/0/0
 description TRUNK-TO-SW_AGR3
 no ip address
 no shutdown
!
interface GigabitEthernet0/0/0.105
 description CLIENT5
 encapsulation dot1Q 105
 vrf forwarding CLIENT5
 ip address 172.16.5.1 255.255.255.252
!
interface GigabitEthernet0/0/0.200
 description DC_CENTRAL
 encapsulation dot1Q 200
 vrf forwarding DC_CENTRAL
 ip address 172.16.100.1 255.255.255.252
!
interface GigabitEthernet0/0/0.201
 description DC_PUB
 encapsulation dot1Q 201
 vrf forwarding DC_PUB
 ip address 172.16.199.1 255.255.255.252
!
! ================================================================
! IS-IS — Backbone IGP (transport + segment routing)
! ================================================================
router isis CORE
 net 49.0001.0102.5501.3013.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 fast-reroute per-prefix level-2 all
 segment-routing mpls
!
! ================================================================
! MP-BGP — iBGP VPNv4 to Route Reflector + per-VRF eBGP to CE
! ================================================================
router bgp 65000
 bgp log-neighbor-changes
 !
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Loopback0
 !
 neighbor 10.255.2.2 remote-as 65000
 neighbor 10.255.2.2 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community extended
  neighbor 10.255.2.2 activate
  neighbor 10.255.2.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CLIENT5
  neighbor 172.16.5.2 remote-as 65023
  neighbor 172.16.5.2 activate
 exit-address-family
 !
 address-family ipv4 vrf DC_CENTRAL
  neighbor 172.16.100.2 remote-as 65023
  neighbor 172.16.100.2 activate
 exit-address-family
 !
 address-family ipv4 vrf DC_PUB
  neighbor 172.16.199.2 remote-as 65023
  neighbor 172.16.199.2 activate
 exit-address-family
!
end