!
hostname SW_AGR3
!
no ip domain-lookup
ip routing
ip cef
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
ip vrf CLIENT5
 rd 65023:5
 route-target export 65023:5
 route-target import 65023:5
!
ip vrf DC_CENTRAL
 rd 65023:100
 route-target export 65023:100
 route-target import 65023:100
!
ip vrf DC_PRIVATE
 rd 65023:201
 route-target export 65023:201
 route-target import 65023:201
!
vlan 105
 name CLIENT5_PE_LINK
!
vlan 200
 name DC_CENTRAL_PE_LINK
!
vlan 201
 name DC_PRIVATE_PE_LINK
!
vlan 305
 name CLIENT5_LAN
!
vlan 500
 name DC_SERVERS
!
vlan 510
 name DC_MGMT
!
vlan 520
 name DC_PRIVATE_LAN
!
interface GigabitEthernet1/0/1
 description TRUNK-TO-R3E-Gi0/0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 105,200,201
 no shutdown
!
interface GigabitEthernet1/0/10
 description CLIENT5-ACCESS
 switchport access vlan 305
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/20
 description SUPERMICRO-SERVER-DATA
 switchport access vlan 500
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/21
 description SUPERMICRO-SERVER-MGMT
 switchport access vlan 510
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/22
 description SLICAN-VOIP-SERVER
 switchport access vlan 500
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/23
 description SUPERMICRO-SERVER-PRIVATE-NETFLOW
 switchport access vlan 520
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface Vlan105
 description CLIENT5-PE-LINK
 ip vrf forwarding CLIENT5
 ip address 172.16.5.2 255.255.255.252
 no shutdown
!
interface Vlan200
 description DC-CENTRAL-PE-LINK
 ip vrf forwarding DC_CENTRAL
 ip address 172.16.100.2 255.255.255.252
 no shutdown
!
interface Vlan201
 description DC-PRIVATE-PE-LINK
 ip vrf forwarding DC_PRIVATE
 ip address 172.16.201.2 255.255.255.252
 no shutdown
!
interface Vlan305
 description CLIENT5-LAN-GATEWAY
 ip vrf forwarding CLIENT5
 ip address 192.168.5.1 255.255.255.0
 no shutdown
!
interface Vlan500
 description DC-SERVERS-GATEWAY
 ip vrf forwarding DC_CENTRAL
 ip address 10.100.0.1 255.255.255.0
 no shutdown
!
interface Vlan510
 description DC-MGMT-GATEWAY
 ip vrf forwarding DC_CENTRAL
 ip address 10.100.10.1 255.255.255.0
 no shutdown
!
interface Vlan520
 description DC-PRIVATE-LAN-GATEWAY
 ip vrf forwarding DC_PRIVATE
 ip address 10.100.20.1 255.255.255.0
 no shutdown
!
router bgp 65023
 bgp router-id 172.16.5.2
 bgp log-neighbor-changes
 !
 address-family ipv4 vrf CLIENT5
  network 192.168.5.0 mask 255.255.255.0
  neighbor 172.16.5.1 remote-as 65000
  neighbor 172.16.5.1 activate
 exit-address-family
 !
 address-family ipv4 vrf DC_CENTRAL
  network 10.100.0.0 mask 255.255.255.0
  network 10.100.10.0 mask 255.255.255.0
  neighbor 172.16.100.1 remote-as 65000
  neighbor 172.16.100.1 activate
 exit-address-family
 !
 address-family ipv4 vrf DC_PRIVATE
  network 10.220.0.0 mask 255.255.255.0
  neighbor 172.16.201.1 remote-as 65000
  neighbor 172.16.201.1 activate
 exit-address-family
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
 exec-timeout 30 0
line vty 0 15
 login local
 transport input ssh
!
end
