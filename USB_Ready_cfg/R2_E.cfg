hostname R2E
!
! ================================================================
! Global SR-MPLS
! ================================================================
segment-routing mpls
 !
 set-attributes
  address-family ipv4
   sr-label-preferred
  exit-address-family
 !
 connected-prefix-sid-map
  address-family ipv4
   10.255.12.12/32 index 120 range 1
  exit-address-family
!
! ================================================================
! IS-IS process must exist with segment-routing mpls enabled BEFORE
! any interface attempts "isis prefix-sid index N" — otherwise the
! parser rejects the prefix-sid line on a fresh boot.
! ================================================================
router isis CORE
 net 49.0001.0102.5501.2012.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 fast-reroute per-prefix level-2 all
 segment-routing mpls
!
! ================================================================
! VRF Definitions — MUST appear before interfaces that reference them
! On IOS-XE, route-target MUST be inside address-family ipv4
!
! Naming: CLIENT_N maps strictly to RD 65000:N.
! Every R2E tenant exports its own RT plus 65000:1000 (TO_DC_PUB)
! and 65000:2000 (TO_DC_CENTRAL). SW_AGR2 tenants reach BOTH
! Supermicro and Slican.
! ================================================================
!
vrf definition CLIENT21
 rd 65000:21
 !
 address-family ipv4
  route-target export 65000:21
  route-target export 65000:1000
  route-target export 65000:2000
  route-target import 65000:21
  route-target import 65000:99
  route-target import 65000:100
 exit-address-family
!
