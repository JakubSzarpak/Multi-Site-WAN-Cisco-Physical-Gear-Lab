! ================================================================
! Loopback — Router-ID, SR-ID, BGP update-source
! ================================================================
interface Loopback0
 ip address 10.255.12.12 255.255.255.255
 ip router isis CORE
!
! ================================================================
! WAN Uplink to Core P Router R2C
! ================================================================
interface GigabitEthernet0/0/2
 description TO-R2C
 ip address 10.0.102.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 no shutdown
!
! ================================================================
! Trunk to Aggregation Switch SW_AGR2
! Carries VLAN 121-140 (CLIENT21-CLIENT40) + VLAN 141 (SHARED_102)
! ================================================================
interface GigabitEthernet0/0/0
 description TRUNK-TO-SW_AGR2
 no ip address
 no shutdown
!
interface GigabitEthernet0/0/0.121
